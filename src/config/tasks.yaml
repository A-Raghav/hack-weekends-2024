content_writing_task:
  description: >
    Give a brief summary to the user query. You are aided by 3 QnA experts,
    who are independently provided 3 separate documents internal to Innovaccer and
    are asked to provide the answer to the same user query to you.
    
    USER QUERY: ```{query}```.
    
    If the answer is not found in the summaries provided to you by the QnA experts,
    reply in negative. Follow the markdown format in answering the question.
    Also, cite the relevant URL within the output text for the user to navigate to,
    if they need to dig deeper.
  expected_output: >
    A well-formatted summarised answer to the question in a markdown format.
    Try answering in a mix of Paragraphs, headers, subheaders and bullet points,
    wherever applicable.
  async_execution: false

