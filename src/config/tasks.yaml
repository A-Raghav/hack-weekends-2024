answer_question_task_1:
  description: >
    Provide a detailed relevant document summary corresponding to the user query:
    
    USER QUERY: ```{query}```
    CONTEXT: ```{document_1}```

    Also, provide the URL for the relevant documents so that the user may look
    deeper into it. If you feel the answer is not found in the context, reply
    "I could not find any relevant answer for the query". Since your response 
    will be summarised later by a text-summariser, you can be detailed in your
    response.
  expected_output: >
    A Detailed Summarised Answer to the question in a markdown format.
  async_execution: true

